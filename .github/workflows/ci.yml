name: CI

on:
  pull_request:
    branches:
      - main
      - "feat/**"
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  EIDETIC_FETCH_PUMAS: "1"

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: clippy,rustfmt

      - name: Prepare Pumas dependency
        run: scripts/prepare-pumas-dependency.sh

      - name: Verify no native ONNX download features before building
        run: |
          cargo metadata --locked --all-features --format-version 1 > "${RUNNER_TEMP}/eidetic-cargo-metadata.json"
          python3 scripts/check-onnx-no-download.py "${RUNNER_TEMP}/eidetic-cargo-metadata.json"
          python3 -m unittest discover -s scripts -p 'test_check_onnx_no_download.py' -v

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --all-targets

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authoring HTTP fixture regressions (no native runtime)
        run: python3 -m unittest discover -s scripts -p 'test_qualify_screenplay_authoring.py' -v

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Frontend lint
        working-directory: ui
        run: npm run lint

      - name: Frontend format
        working-directory: ui
        run: npm run format:check

      - name: Frontend typecheck
        working-directory: ui
        run: npm run typecheck

      - name: Frontend tests
        working-directory: ui
        run: npm run test

  traceability:
    name: Decision Traceability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install traceability dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Check decision traceability
        run: scripts/check-decision-traceability.sh
