name: Recalled facts targeted preview native qualification

on:
  push:
    branches: [test/recalled-facts-preview-native]

permissions:
  contents: read

concurrency:
  group: eidetic-recalled-facts-preview-native
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EIDETIC_FETCH_PUMAS: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      EIDETIC_CAPTURE_SOURCE: e140290ed4414585c0c507874fab5b0e04c9dc22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify unchanged application source
        run: |
          git merge-base --is-ancestor "$EIDETIC_CAPTURE_SOURCE" HEAD
          python3 - <<'PY'
          import os, subprocess
          allowed = {
              '.github/workflows/recalled-facts-native.yml',
              'crates/server/examples/bible_recall_capture_fixture.rs',
              'scripts/qualify-bible-recall.py',
              'scripts/test_qualify_bible_recall.py',
              'scripts/qualify-recalled-facts-preview.py',
              'scripts/test_qualify_recalled_facts_preview.py',
              'scripts/recalled-facts-vite.config.mts',
              'ui/src/qualification/recalledFacts.svelte.ts',
              'ui/src/qualification/RecalledFactsControls.svelte',
              'ui/src/qualification/README.md',
          }
          changed = set(subprocess.check_output([
              'git', 'diff', '--name-only', os.environ['EIDETIC_CAPTURE_SOURCE'], 'HEAD'
          ], text=True).splitlines())
          if changed - allowed:
              raise SystemExit('Application source differs from the reviewed capture source')
          PY
      - name: Install standard Linux and display dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            xvfb xauth xdotool imagemagick dbus-x11 \
            at-spi2-core python3-pyatspi
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.92.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Prepare pinned dependency and UI assets
        timeout-minutes: 5
        run: |
          scripts/prepare-pumas-dependency.sh
          npm --prefix ui ci
          npm --prefix ui test
          npm --prefix ui run typecheck
          npm --prefix ui run lint
          npm --prefix ui run format:check
          npm --prefix ui run build
          cargo metadata --locked --all-features --format-version 1 > /tmp/eidetic-onnx-metadata.json
          python3 scripts/check-onnx-no-download.py /tmp/eidetic-onnx-metadata.json
          python3 -m unittest discover -s scripts -p 'test_check_onnx_no_download.py' -v
          python3 -m unittest discover -s scripts -p 'test_qualify_*.py' -v
      - name: Build labelled native selected-fact test host
        timeout-minutes: 3
        run: |
          cd ui
          npx vite build --config ../scripts/recalled-facts-vite.config.mts
          python3 - <<'PY'
          from pathlib import Path
          chunks = '\n'.join(p.read_text() for p in Path('../dist/ui/_app/immutable').rglob('*.js'))
          for marker in ('QA replay stale selection', 'QA mutate selected Keeper fact', 'Author-selected recalled facts used for this preview', 'projection_bible_recall'):
              if marker not in chunks:
                  raise SystemExit('Missing compiled selected-fact seam: ' + marker)
          PY
      - name: Check resource floors and build actual native runtime
        timeout-minutes: 20
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          memory = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          if int(memory['MemAvailable'].split()[0]) < 2 * 1024 * 1024:
              raise SystemExit('Below 2 GiB available memory floor')
          if shutil.disk_usage('.').free < 6 * 1024**3:
              raise SystemExit('Below 6 GiB free workspace disk floor')
          PY
          # Same locked ort-sys/Pumas dependency route as the passing Linux CI job.
          # No skipped download, alternate ORT source, or sandbox overrides.
          cargo build --locked -p eidetic-desktop --bin eidetic-desktop
          cargo build --locked -p eidetic-server --example bible_recall_capture_fixture
      - name: Run actual server regressions
        timeout-minutes: 5
        run: |
          cargo clippy --locked -p eidetic-core -p eidetic-server --all-targets -- -D warnings
          cargo test --locked -p eidetic-core
          cargo test --locked -p eidetic-server --lib
      - name: Qualify real client inspector effects with labelled selected-fact seams
        timeout-minutes: 10
        env:
          EIDETIC_CAPTURE_DIR: ${{ runner.temp }}/eidetic-capture-artifact
        run: |
          xvfb-run -a -s '-screen 0 1920x1440x24 -nolisten tcp' \
            dbus-run-session -- /usr/bin/python3 scripts/qualify-recalled-facts-preview.py
      - name: Upload only reviewed capture outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eidetic-recalled-facts-preview-native-e140290
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/eidetic-capture-artifact/*.png
            ${{ runner.temp }}/eidetic-capture-artifact/app-sanitized.log
            ${{ runner.temp }}/eidetic-capture-artifact/qualification-host-sanitized.log
            ${{ runner.temp }}/eidetic-capture-artifact/capture-evidence.json
