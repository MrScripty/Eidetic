name: Saved screenplay block removal native qualification

on:
  push:
    branches: [test/screenplay-removal-native]

permissions:
  contents: read

concurrency:
  group: eidetic-screenplay-removal-native
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  capture:
    runs-on: ubuntu-24.04
    # Exact removal workflow through the actual native application.
    timeout-minutes: 95
    env:
      EIDETIC_FETCH_PUMAS: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      EIDETIC_CAPTURE_SOURCE: 34260ac264e7b1b2c17c414274a211baf2dc1ca2
      EIDETIC_CAPTURE_SCOPE: screenplay-removal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify unchanged application source
        run: |
          git merge-base --is-ancestor "$EIDETIC_CAPTURE_SOURCE" HEAD
          python3 - <<'PY'
          import os, subprocess
          allowed = {
              '.github/workflows/manual-fact-native.yml',
              'crates/server/examples/manual_fact_capture_fixture.rs',
              'scripts/manual-fact-native-helpers.py',
              'scripts/qualify-manual-fact-reconciliation.py',
              'scripts/test_qualify_manual_fact_reconciliation.py',
              'scripts/manual-facts-vite.config.mts',
              'ui/src/qualification/manualFacts.svelte.ts',
              'ui/src/qualification/ManualFactControls.svelte',
              'ui/src/qualification/README.md',
              'ui/src/qualification/notesPrompt.svelte.ts',
          }
          changed = set(subprocess.check_output([
              'git', 'diff', '--name-only', os.environ['EIDETIC_CAPTURE_SOURCE'], 'HEAD'
          ], text=True).splitlines())
          if changed != allowed:
              raise SystemExit('Qualification delta differs from exact enumerated ten QA files: ' + repr(sorted(changed)))
          PY
      - name: Install standard Linux and display dependencies
        # Run37717759278 exhausted 10m while Azure was still delivering packages.
        # Keep the same package/dependency route and allow its measured slow transfer.
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            xvfb xauth xdotool imagemagick dbus-x11 \
            at-spi2-core python3-pyatspi ripgrep
          scripts/check-decision-traceability.sh
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.92.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Prepare pinned dependency and UI assets
        timeout-minutes: 5
        run: |
          scripts/prepare-pumas-dependency.sh
          npm --prefix ui ci
          npm --prefix ui test
          npm --prefix ui run typecheck
          npm --prefix ui run lint
          npm --prefix ui run format:check
          npm --prefix ui run build
          cargo metadata --locked --all-features --format-version 1 > /tmp/eidetic-onnx-metadata.json
          python3 scripts/check-onnx-no-download.py /tmp/eidetic-onnx-metadata.json
          python3 -m unittest discover -s scripts -p 'test_check_onnx_no_download.py' -v
          python3 -m unittest discover -s scripts -p 'test_qualify_*.py' -v
      - name: Build labelled native saved-edit test host
        timeout-minutes: 3
        run: |
          cd ui
          npx vite build --config ../scripts/manual-facts-vite.config.mts
          python3 - <<'PY'
          from pathlib import Path
          chunks = '\n'.join(p.read_text() for p in Path('../dist/ui/_app/immutable').rglob('*.js'))
          for marker in ('QA replay exact analysis', 'QA relationship edit and restore', 'Analyze saved edit', 'command_script_fact_proposal_analyze', 'QA hold next real context response'):
              if marker not in chunks:
                  raise SystemExit('Missing compiled selected-fact seam: ' + marker)
          PY
      - name: Check resource floors and build actual native runtime
        timeout-minutes: 20
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          memory = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          if int(memory['MemAvailable'].split()[0]) < 2 * 1024 * 1024:
              raise SystemExit('Below 2 GiB available memory floor')
          if shutil.disk_usage('.').free < 6 * 1024**3:
              raise SystemExit('Below 6 GiB free workspace disk floor')
          PY
          # Same pinned Pumas and enforced no-native-ONNX-download route as CI.
          # Feature union checked above; no alternate ORT source or sandbox overrides.
          cargo build --locked -p eidetic-desktop --bin eidetic-desktop
          cargo build --locked -p eidetic-server --example manual_fact_capture_fixture
      - name: Run actual server regressions
        timeout-minutes: 5
        run: |
          cargo clippy --locked -p eidetic-core -p eidetic-server --all-targets --all-features -- -D warnings
          cargo test --locked -p eidetic-core -p eidetic-server --all-targets
      - name: Qualify ordinary saved-block removal, exact replay and downstream review
        timeout-minutes: 10
        env:
          EIDETIC_CAPTURE_DIR: ${{ runner.temp }}/eidetic-capture-artifact
        run: |
          xvfb-run -a -s '-screen 0 1920x1440x24 -nolisten tcp' \
            dbus-run-session -- /usr/bin/python3 scripts/qualify-manual-fact-reconciliation.py
      - name: Repeat the interrupted removal workflow on a fresh isolated project
        timeout-minutes: 10
        env:
          EIDETIC_CAPTURE_SCOPE: screenplay-removal-repeat
          EIDETIC_CAPTURE_DIR: ${{ runner.temp }}/eidetic-capture-artifact/screenplay-removal-repeat
        run: |
          xvfb-run -a -s '-screen 0 1920x1440x24 -nolisten tcp' \
            dbus-run-session -- /usr/bin/python3 scripts/qualify-manual-fact-reconciliation.py
      - name: Upload only reviewed capture outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eidetic-screenplay-removal-native-b17bfbc
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/eidetic-capture-artifact/*.png
            ${{ runner.temp }}/eidetic-capture-artifact/*.jpg
            ${{ runner.temp }}/eidetic-capture-artifact/app-sanitized.log
            ${{ runner.temp }}/eidetic-capture-artifact/qualification-host-sanitized.log
            ${{ runner.temp }}/eidetic-capture-artifact/capture-evidence.json
            ${{ runner.temp }}/eidetic-capture-artifact/screenplay-removal-repeat/*.png
            ${{ runner.temp }}/eidetic-capture-artifact/screenplay-removal-repeat/*.jpg
            ${{ runner.temp }}/eidetic-capture-artifact/screenplay-removal-repeat/app-sanitized.log
            ${{ runner.temp }}/eidetic-capture-artifact/screenplay-removal-repeat/qualification-host-sanitized.log
            ${{ runner.temp }}/eidetic-capture-artifact/screenplay-removal-repeat/capture-evidence.json
